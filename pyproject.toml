[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-hue"
version = "0.9.0"
description = "Desktop control for Philips Hue (Wayland/Hyprland) via the local CLIP v2 API, with screen-sync ambilight"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "requests>=2.28",
    "pywebview>=5.0",
    "pystray>=0.19",
    "pillow",
]


# pywebview's GTK backend and pystray's Linux tray icon both need PyGObject
# and a GTK/AppIndicator stack at runtime - not pip-installable, system
# packages only ride the same PyGObject install, nothing extra needed.

[project.optional-dependencies]
# Packaging hue-webui only (see packaging/lumen-webui.spec) - not needed to
# develop or run the app. AUR-only on Arch (`paru -S pyinstaller`); a plain
# venv with `pip install pyinstaller` works just as well and needs no sudo.
dev = ["pyinstaller>=6.0"]

[project.scripts]
hue = "huectl.cli:main"
hue-sync = "huectl.sync:main"
hue-webui = "huectl.webapp:main"

[tool.setuptools]
packages = ["huectl"]
[tool.setuptools.package-data]
huectl = ["webui_dist/**/*"]
